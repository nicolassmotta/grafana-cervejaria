# Cervejaria Byte: ambiente completo da demonstração.
#
#   docker compose up -d --build
#
# Sobe quatro serviços:
#   postgres     -> banco de dados onde ficam as leituras dos sensores
#   simulador    -> script Python que finge ser os sensores da fábrica
#   grafana      -> painéis e alertas em http://localhost:3000
#   notificador  -> recebe os avisos de alerta do Grafana e mostra no terminal
#
# As senhas abaixo são só para esta demo local. Nunca use senhas fixas assim em produção.

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: cervejaria
      POSTGRES_USER: cervejaria
      POSTGRES_PASSWORD: cervejaria
    # Sem "ports": o banco só é acessível pelos outros containers, então não conflita com
    # um PostgreSQL instalado na máquina. Para acessar de fora (DBeaver etc.), adicione:
    #   ports: ["5433:5432"]
    volumes:
      # Scripts .sql desta pasta rodam automaticamente na primeira inicialização do banco
      - ./sql:/docker-entrypoint-initdb.d:ro
      - dados-postgres:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1: só responde "pronto" depois que os scripts de sql/ terminaram de rodar
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cervejaria -d cervejaria"]
      interval: 2s
      timeout: 3s
      retries: 30

  simulador:
    build: ./simulador
    environment:
      DATABASE_URL: postgresql://cervejaria:cervejaria@postgres:5432/cervejaria
      INTERVALO_SEGUNDOS: "5"
      HORAS_HISTORICO: "6"
      TZ: America/Sao_Paulo # horário dos logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  notificador:
    build: ./notificador
    environment:
      TZ: America/Sao_Paulo # horário dos logs
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cervejaria
      GF_USERS_DEFAULT_LANGUAGE: pt-BR
    volumes:
      # "Provisionamento": fonte de dados, dashboard e alertas definidos em arquivos (configuração como código)
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - dados-grafana:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
      notificador:
        condition: service_started

volumes:
  dados-postgres:
  dados-grafana:
