# Alertas da fábrica, em três partes:
#   1. contactPoints: PARA ONDE os avisos vão (aqui, o serviço notificador via webhook)
#   2. policies:      COMO os avisos são agrupados e com que frequência são reenviados
#   3. groups:        QUANDO disparar (a regra de temperatura)
apiVersion: 1

contactPoints:
  - orgId: 1
    name: Central da fábrica
    receivers:
      - uid: central-da-fabrica
        type: webhook
        settings:
          url: http://notificador:8000/alertas
          httpMethod: POST

policies:
  - orgId: 1
    receiver: Central da fábrica
    group_by: [alertname, tanque] # um aviso separado por tanque
    group_wait: 1s # avisa logo que o alerta dispara
    group_interval: 10s
    repeat_interval: 1h # enquanto continuar disparado, repete o aviso a cada hora

groups:
  - orgId: 1
    name: Tanques de fermentação
    folder: Cervejaria
    interval: 10s
    rules:
      # A query roda a cada 10s e cada linha do resultado (um tanque) vira um alerta separado
      - uid: temperatura-acima-do-limite
        title: Temperatura acima do limite
        condition: C
        data:
          # A: quantos °C cada tanque está acima do seu limite (negativo = dentro da faixa)
          - refId: A
            datasourceUid: cervejaria-pg
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: A
              format: table
              editorMode: code
              rawQuery: true
              rawSql: |
                SELECT DISTINCT ON (t.codigo)
                       t.codigo                         AS tanque,
                       t.estilo                         AS estilo,
                       l.temperatura_c - t.temp_max_c   AS excesso_c
                FROM leituras_tanque l
                JOIN tanques t ON t.id = l.tanque_id
                WHERE l.momento > now() - interval '1 minute'
                ORDER BY t.codigo, l.momento DESC
          # C: a condição do alerta, excesso maior que zero
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 20s # fica "Pendente" por 20s antes de disparar, para evitar alarme falso por um pico isolado
        noDataState: NoData
        execErrState: Error
        labels:
          severidade: critica
        annotations:
          # Liga a regra ao gráfico de temperatura: as mudanças de estado do alerta aparecem nele
          __dashboardUid__: cervejaria
          __panelId__: "5"
          summary: '{{ $labels.tanque }} ({{ $labels.estilo }}) está acima da temperatura máxima'
          description: 'Excesso atual: {{ printf "%.1f" $values.A.Value }} °C acima do limite. Verifique a refrigeração.'
